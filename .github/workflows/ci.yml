name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` can compile; no real credentials needed.
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ci-dummy
          SPOTIFY_CLIENT_ID: ci-dummy
          SPOTIFY_CLIENT_SECRET: ci-dummy
          NEXT_PUBLIC_SPOTIFY_REDIRECT_URI: http://localhost:3000/callback
          SPOTIFY_REDIRECT_URI: http://localhost:3000/callback
